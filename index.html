<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noai, noimageai" />
  <title>Botanical Biodesign Reference Studio</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-studio: #f4f6f4;
      --bg-paper: #ffffff;
      --ink-primary: #1e2621;
      --ink-secondary: #5c6660;
      --accent-botanical: #235c42;
      --accent-soft: #e6f0eb;
      --border-subtle: #dfe5e0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-studio);
      color: var(--ink-primary);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-serif-title {
      font-family: 'Noto Serif SC', Georgia, serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    /* Disable image dragging to deter casual scraping */
    img {
      -webkit-user-drag: none;
      user-select: none;
    }
    .watermark-overlay {
      background: repeating-linear-gradient(
        -32deg,
        rgba(255, 255, 255, 0.0) 0px,
        rgba(255, 255, 255, 0.0) 68px,
        rgba(255, 255, 255, 0.08) 69px,
        rgba(255, 255, 255, 0.08) 70px
      );
      pointer-events: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5ce;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Anti-Commercial & Anti-AI-Training Compliance Banner -->
  <div class="bg-[#18221d] text-[#d8e6df] text-xs px-4 py-2 border-b border-[#2c3e35] flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <span data-i18n="policyBadge" class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-900/80 text-emerald-200 border border-emerald-700/60 font-mono-code">
      </span>
      <span id="banner-text" data-i18n-html="banner"></span>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-open-license" type="button" class="underline hover:text-white transition cursor-pointer">
        <span data-i18n="openLicense"></span>
      </button>
      <span class="text-emerald-400/60">|</span>
      <button id="btn-lang-toggle" type="button" class="px-2.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-white font-medium transition cursor-pointer">
        中 / EN
      </button>
    </div>
  </div>

  <!-- Main Header & Navigation Bar -->
  <header class="bg-white/95 backdrop-blur sticky top-0 z-30 border-b border-[#dfe5e0] px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#1e4633] text-white flex items-center justify-center font-serif-title text-lg font-bold shadow-sm">
          葉
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-serif-title text-lg sm:text-xl font-bold tracking-tight text-[#16201a]" id="app-title">
              Botanical Biodesign Reference Studio
            </h1>
            <span id="dataset-label" class="text-xs font-mono-code px-2 py-0.5 rounded bg-[#e6f0eb] text-[#1e4633] font-medium">
            </span>
          </div>
          <p class="text-xs text-[#5c6660]" id="app-subtitle" data-i18n="subtitle"></p>
        </div>
      </div>

      <!-- Primary View Mode Tabs -->
      <nav class="flex items-center gap-1.5 bg-[#f0f4f1] p-1 rounded-xl border border-[#dfe5e0]">
        <button id="tab-gallery" type="button" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition bg-white text-[#16201a] shadow-sm">
          <span data-i18n="tabGallery"></span>
        </button>
        <button id="tab-taxon-matrix" type="button" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition text-[#4a554e] hover:text-[#16201a]">
          <span data-i18n="tabMatrix"></span>
        </button>
        <button id="tab-compare" type="button" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition text-[#4a554e] hover:text-[#16201a]">
          <span data-i18n="tabCompare"></span> (<span id="compare-count">2</span>)
        </button>
        <button id="tab-directory" type="button" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition text-[#4a554e] hover:text-[#16201a]">
          <span data-i18n="tabDirectory"></span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Workspace Container -->
  <div class="max-w-7xl w-full mx-auto flex-1 px-4 lg:px-8 py-6">

    <!-- VIEW 1: REFERENCE GALLERY (Default) -->
    <section id="view-gallery" class="space-y-6">
      <!-- KPI Summary Bar -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl p-3.5 border border-[#dfe5e0] shadow-sm">
          <div class="text-xs text-[#5c6660]" id="kpi-1-label" data-i18n="kpiThemes"></div>
          <div class="text-xl sm:text-2xl font-bold text-[#16201a] font-mono-code mt-0.5"><span id="kpi-theme-count">89</span> <span class="text-xs font-normal text-[#235c42]" data-i18n="themeUnit"></span></div>
          <div class="text-[11px] text-[#5c6660] mt-0.5" data-i18n="kpiThemesNote"></div>
        </div>
        <div class="bg-white rounded-2xl p-3.5 border border-[#dfe5e0] shadow-sm">
          <div class="text-xs text-[#5c6660]" id="kpi-2-label" data-i18n="kpiViews"></div>
          <div class="text-xl sm:text-2xl font-bold text-[#16201a] font-mono-code mt-0.5"><span id="kpi-view-count">410</span> <span class="text-xs font-normal text-[#235c42]" data-i18n="viewUnit"></span></div>
          <div class="text-[11px] text-[#5c6660] mt-0.5" data-i18n="kpiViewsNote"></div>
        </div>
        <div class="bg-white rounded-2xl p-3.5 border border-[#dfe5e0] shadow-sm">
          <div class="text-xs text-[#5c6660]" id="kpi-3-label" data-i18n="kpiFiles"></div>
          <div class="text-xl sm:text-2xl font-bold text-[#1e4633] font-mono-code mt-0.5"><span id="kpi-webp-count">645</span> <span class="text-xs font-normal">WebP</span></div>
          <div class="text-[11px] text-[#5c6660] mt-0.5" data-i18n="kpiFilesNote"></div>
        </div>
        <div class="bg-white rounded-2xl p-3.5 border border-[#dfe5e0] shadow-sm">
          <div class="text-xs text-[#5c6660]" id="kpi-4-label" data-i18n="kpiSize"></div>
          <div class="text-xl sm:text-2xl font-bold text-[#16201a] font-mono-code mt-0.5"><span id="kpi-size-count">26.1</span> <span class="text-xs font-normal text-[#235c42]">MiB</span></div>
          <div class="text-[11px] text-[#5c6660] mt-0.5" data-i18n="kpiSizeNote"></div>
        </div>
      </div>

      <!-- Three-Axis Biodesign Filter Panel -->
      <div id="filter-panel" class="bg-white rounded-2xl p-4 sm:p-5 border border-[#dfe5e0] shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <!-- Search Input -->
          <div class="relative flex-1 min-w-[240px]">
            <input
              id="search-input"
              type="text"
              data-i18n-placeholder="searchPlaceholder"
              class="w-full pl-9 pr-4 py-2 text-sm rounded-xl border border-[#cbd5ce] focus:outline-none focus:border-[#235c42] bg-[#f9fbf9]"
            />
            <svg class="w-4 h-4 text-[#5c6660] absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
            </svg>
          </div>

          <!-- Toggles: Extended Categories & Mannequin Only & Saved Favorites -->
          <div class="flex flex-wrap items-center gap-3 text-xs">
            <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#f0f4f1] border border-[#dfe5e0] cursor-pointer select-none">
              <input id="toggle-extended" type="checkbox" checked class="accent-[#235c42] rounded cursor-pointer" />
              <span id="label-extended" class="font-medium text-[#1e2621]" data-i18n="extended"></span>
            </label>
            <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#f0f4f1] border border-[#dfe5e0] cursor-pointer select-none">
              <input id="toggle-mannequin" type="checkbox" class="accent-[#235c42] rounded cursor-pointer" />
              <span id="label-mannequin" class="font-medium text-[#1e2621]" data-i18n="mannequin"></span>
            </label>
            <button id="btn-filter-saved" type="button" class="px-3 py-1.5 rounded-xl border border-[#dfe5e0] bg-white hover:bg-[#f0f4f1] font-medium transition cursor-pointer">
              ★ <span data-i18n="saved"></span> (<span id="saved-count">0</span>)
            </button>
            <button id="btn-reset-filters" type="button" class="px-3 py-1.5 rounded-xl text-[#235c42] hover:bg-[#e6f0eb] font-medium transition cursor-pointer">
              <span data-i18n="resetFilters"></span>
            </button>
          </div>
        </div>

        <!-- Axis 1: Garment Engineering Line -->
        <div class="flex flex-wrap items-center gap-1.5 text-xs">
          <span class="text-[#5c6660] font-medium mr-1" id="axis-garment-label" data-i18n="axisGarment"></span>
          <div id="garment-filters" class="contents"></div>
        </div>

        <!-- Axis 2: Botanical Clade & Morphological Organ -->
        <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-[#eef2ee] text-xs">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="text-[#5c6660] font-medium mr-1" id="axis-clade-label" data-i18n="axisClade"></span>
            <div id="clade-filters" class="contents"></div>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="text-[#5c6660] font-medium mr-1" id="axis-organ-label" data-i18n="axisOrgan"></span>
            <div id="organ-filters" class="contents"></div>
          </div>
        </div>
      </div>

      <!-- Active Result Count & Hint -->
      <div class="flex items-center justify-between text-xs text-[#5c6660] px-1">
        <div id="result-summary" class="flex items-center gap-1"></div>
        <div class="hidden sm:block">
          <span data-i18n="viewHint"></span>
        </div>
      </div>

      <!-- Cards Grid -->
      <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </section>

    <!-- VIEW 2: CROSS-CATEGORY TAXON MATRIX (Ginkgo Case Study) -->
    <section id="view-taxon-matrix" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 border border-[#dfe5e0] shadow-sm space-y-4">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <span class="text-xs font-mono-code uppercase tracking-wider px-2.5 py-1 rounded-md bg-[#e6f0eb] text-[#1e4633] font-semibold">
              <span data-i18n="matrixEyebrow"></span>
            </span>
            <h2 class="font-serif-title text-xl sm:text-2xl font-bold text-[#16201a] mt-2">
              <span data-i18n="matrixTitle"></span>
            </h2>
            <p class="text-sm text-[#5c6660] mt-1 max-w-3xl">
              <span data-i18n="matrixDescription"></span>
            </p>
          </div>
          <button id="btn-back-gallery-from-taxon" type="button" class="px-3.5 py-2 rounded-xl border border-[#cbd5ce] text-xs font-medium hover:bg-[#f0f4f1] cursor-pointer">
            <span data-i18n="backGallery"></span>
          </button>
        </div>

        <div id="ginkgo-matrix-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 pt-2"></div>
      </div>
    </section>

    <!-- VIEW 3: SIDE-BY-SIDE COMPARE WORKBENCH -->
    <section id="view-compare" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 border border-[#dfe5e0] shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-serif-title text-xl font-bold text-[#16201a]">
              <span data-i18n="compareTitle"></span>
            </h2>
            <p class="text-xs text-[#5c6660] mt-0.5">
              <span data-i18n="compareDescription"></span>
            </p>
          </div>
          <button id="btn-clear-compare" type="button" class="px-3 py-1.5 rounded-xl border border-[#cbd5ce] text-xs hover:bg-[#f0f4f1] cursor-pointer">
            <span data-i18n="clearCompare"></span>
          </button>
        </div>
        <div id="compare-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2"></div>
      </div>
    </section>

    <!-- VIEW 4: CURRENT CATALOG DIRECTORY -->
    <section id="view-directory" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 border border-[#dfe5e0] shadow-sm space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-serif-title text-xl font-bold text-[#16201a]">
              <span data-i18n="directoryTitle"></span>
            </h2>
            <p class="text-xs text-[#5c6660] mt-0.5">
              <span data-i18n="directoryDescription"></span>
            </p>
          </div>
          <button id="btn-copy-robots" type="button" class="px-3.5 py-2 rounded-xl bg-[#235c42] text-white text-xs font-medium hover:bg-[#1b4933] transition cursor-pointer">
            <span data-i18n="copyPolicy"></span>
          </button>
        </div>

        <div class="overflow-x-auto border border-[#dfe5e0] rounded-xl">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-[#f0f4f1] text-[#1e2621] border-b border-[#dfe5e0]">
                <th class="py-3 px-3.5 font-semibold" data-i18n="thCategory"></th>
                <th class="py-3 px-3.5 font-semibold text-right" data-i18n="thThemes"></th>
                <th class="py-3 px-3.5 font-semibold text-right" data-i18n="thViews"></th>
                <th class="py-3 px-3.5 font-semibold" data-i18n="thClades"></th>
                <th class="py-3 px-3.5 font-semibold" data-i18n="thExamples"></th>
              </tr>
            </thead>
            <tbody id="directory-table-body" class="divide-y divide-[#eef2ee]"></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>

  <!-- Detail Lightbox Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-[#dfe5e0] flex flex-col md:flex-row">
      <div class="md:w-1/2 bg-[#141a17] relative flex flex-col items-center justify-center p-4">
        <div class="relative w-full flex items-center justify-center">
          <img id="modal-img" src="" alt="" class="max-h-[68vh] w-auto rounded-lg object-contain" />
          <div class="watermark-overlay absolute inset-0 rounded-lg"></div>
        </div>
        <div id="modal-view-strip" class="flex flex-wrap items-center justify-center gap-1.5 mt-3"></div>
      </div>
      <div class="md:w-1/2 p-6 flex flex-col justify-between space-y-4">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span id="modal-code" class="font-mono-code text-xs px-2.5 py-1 rounded bg-[#e6f0eb] text-[#1e4633] font-semibold"></span>
            <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-full bg-[#f0f4f1] hover:bg-[#e2ebe4] flex items-center justify-center text-sm font-bold cursor-pointer">✕</button>
          </div>
          <h3 id="modal-title" class="font-serif-title text-xl font-bold text-[#16201a]"></h3>
          <p id="modal-latin" class="text-xs italic text-[#5c6660] font-mono-code"></p>

          <div class="bg-[#f7faf8] p-3.5 rounded-xl border border-[#dfe5e0] space-y-1.5">
            <div class="text-xs font-semibold text-[#1e4633]" data-i18n="modalAnchorLabel"></div>
            <p id="modal-anchor" class="text-xs text-[#37423b] leading-relaxed"></p>
          </div>

          <div class="bg-[#f7faf8] p-3.5 rounded-xl border border-[#dfe5e0] space-y-1.5">
            <div class="text-xs font-semibold text-[#1e4633]" data-i18n="modalTranslationLabel"></div>
            <p id="modal-translation" class="text-xs text-[#37423b] leading-relaxed"></p>
          </div>
        </div>

        <div class="space-y-3 pt-3 border-t border-[#eef2ee]">
          <div class="p-3 rounded-xl bg-amber-50/90 border border-amber-200 text-[11px] text-amber-900 leading-relaxed">
            <strong data-i18n="licenseRestriction"></strong><br/>
            <strong data-i18n="licenseRestrictionDetail"></strong>
          </div>
          <div class="flex items-center gap-2">
            <button id="modal-btn-copy-json" type="button" class="flex-1 py-2 px-3 rounded-xl bg-[#235c42] text-white text-xs font-medium hover:bg-[#1b4933] transition cursor-pointer">
              <span data-i18n="copyMetadata"></span>
            </button>
            <button id="modal-btn-add-compare" type="button" class="py-2 px-3 rounded-xl border border-[#cbd5ce] text-xs font-medium hover:bg-[#f0f4f1] transition cursor-pointer">
              <span data-i18n="addCompare"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="w-full border-t border-[#dfe5e0] bg-white px-4 py-4 text-center text-xs text-[#5c6660]">
    <p data-i18n-html="sourceCredit"></p>
  </footer>

  <!-- License Modal -->
  <div id="license-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl border border-[#dfe5e0]">
      <div class="flex items-center justify-between border-b border-[#dfe5e0] pb-3">
        <h3 class="font-serif-title text-lg font-bold text-[#16201a]">
          <span data-i18n="licenseTitle"></span>
        </h3>
        <button id="btn-close-license" type="button" class="w-8 h-8 rounded-full bg-[#f0f4f1] hover:bg-[#e2ebe4] flex items-center justify-center text-sm font-bold cursor-pointer">✕</button>
      </div>
      <div id="license-copy" class="space-y-3 text-xs text-[#37423b] leading-relaxed max-h-[65vh] overflow-y-auto pr-1 custom-scrollbar" data-i18n-html="licenseBody"></div>
      <div class="flex justify-end pt-2">
        <button id="btn-ack-license" type="button" class="px-4 py-2 rounded-xl bg-[#235c42] text-white text-xs font-medium hover:bg-[#1b4933] cursor-pointer">
          <span data-i18n="licenseAcknowledge"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->

  <script>

    };

    const CATEGORY_KEYS = {
      gown: 'categoryGown',
      casual_matrix: 'categoryCasual',
      casual_habitat: 'categoryHabitat',
      intimate: 'categoryIntimate',
      resort: 'categoryResort'
    };

    const CLADE_KEYS = {
      angiosperm: 'cladeAngiosperm',
      gymnosperm: 'cladeGymnosperm',
      pteridophyte: 'cladePteridophyte',
      bryophyte: 'cladeBryophyte',
      algae: 'cladeAlgae'
    };

    const ORGAN_KEYS = {
      floral_corolla: 'organFloral',
      foliage_venation: 'organFoliage',
      micro_pollen: 'organMicro',
      carnivorous: 'organCarnivorous',
      seed_dispersal: 'organSeed'
    };

    function t(key) {
      return UI_TEXT[state.lang][key] || key;
    }

    function localizedName(item) {
      if (state.lang === 'zh') return item.nameZh;
      const name = item.nameEn || item.code;
      if (!/[\u4e00-\u9fff]/.test(name)) return name;
      return `${item.code} · ${t(CATEGORY_KEYS[item.garmentLine] || 'tabGallery')}`;
    }

    function replaceTokens(text, values) {
      return text.replace(/\{(\w+)\}/g, (_, key) => String(values[key] ?? ''));
    }

    function renderFilterButtons() {
      const makeButton = (group, value, labelKey, count, compact = false) => `
        <button type="button" data-filter-group="${group}" data-filter-val="${value}" class="filter-pill ${compact ? 'px-2.5 py-1 rounded-lg' : 'px-3 py-1 rounded-full'} bg-[#f0f4f1] text-[#37423b] hover:bg-[#e2ebe4] font-medium">
          ${t(labelKey)} <span class="font-mono-code">(${count})</span>
        </button>`;
      const countBy = (field, value) => CATALOG.filter(item => item[field] === value).length;

      document.getElementById('garment-filters').innerHTML = [
        makeButton('garment', 'all', 'allCategories', CATALOG.length),
        ...Object.entries(CATEGORY_KEYS).map(([value, key]) => makeButton('garment', value, key, countBy('garmentLine', value)))
      ].join('');
      document.getElementById('clade-filters').innerHTML = [
        makeButton('clade', 'all', 'allClades', CATALOG.length, true),
        ...Object.entries(CLADE_KEYS).filter(([value]) => countBy('clade', value) > 0).map(([value, key]) => makeButton('clade', value, key, countBy('clade', value), true))
      ].join('');
      document.getElementById('organ-filters').innerHTML = [
        makeButton('organ', 'all', 'allOrgans', CATALOG.length, true),
        ...Object.entries(ORGAN_KEYS).filter(([value]) => countBy('organ', value) > 0).map(([value, key]) => makeButton('organ', value, key, countBy('organ', value), true))
      ].join('');
      updateFilterPillsUI();
    }

    function updateSummary() {
      const totalViews = CATALOG.reduce((sum, item) => sum + item.views.length, 0);
      const totalTaxa = new Set(CATALOG.map(item => item.taxonKey)).size;
      const values = { themes: CATALOG.length, views: totalViews };
      document.getElementById('kpi-theme-count').textContent = String(CATALOG.length);
      document.getElementById('kpi-view-count').textContent = String(totalViews);
      document.getElementById('banner-text').innerHTML = replaceTokens(t('banner'), values);
      document.getElementById('dataset-label').textContent = replaceTokens(t('dataset'), values);
      const visible = getFilteredItems().length;
      document.getElementById('result-summary').innerHTML = replaceTokens(t('resultSummary'), {
        visible,
        total: CATALOG.length,
        views: totalViews
      });
    }

    function applyLanguage() {
      document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-html]').forEach(element => {
        element.innerHTML = t(element.dataset.i18nHtml);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });
      document.getElementById('btn-lang-toggle').textContent = t('switchLanguage');
      renderFilterButtons();
      updateSummary();
      renderCards();
      if (state.activeTab === 'taxon-matrix') renderGinkgoMatrix();
      if (state.activeTab === 'compare') renderCompareView();
      if (state.activeTab === 'directory') renderDirectoryTable();
      if (state.modalItemId) openDetailModal(state.modalItemId);
    }

    // Initialize default active view per card
    CATALOG.forEach(item => {
      state.selectedViewByCard[item.id] = item.views[0].key;
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function copyText(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(successMsg); } catch (e) {}
      document.body.removeChild(ta);
    }

    function getFilteredItems() {
      return CATALOG.filter(item => {
        if (!state.showExtended && item.extended) return false;
        if (state.mannequinOnly && !item.hasMannequin) return false;
        if (state.savedOnly && !state.savedIds.has(item.id)) return false;
        if (state.garment !== 'all' && item.garmentLine !== state.garment) return false;
        if (state.clade !== 'all' && item.clade !== state.clade) return false;
        if (state.organ !== 'all' && item.organ !== state.organ) return false;
        if (state.search.trim() !== '') {
          const q = state.search.trim().toLowerCase();
          const hay = (item.code + ' ' + item.nameZh + ' ' + item.nameEn + ' ' + item.latin + ' ' + item.bioAnchorZh + ' ' + item.translationZh).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderCards() {
      const grid = document.getElementById('cards-grid');
      const items = getFilteredItems();
      document.getElementById('saved-count').textContent = String(state.savedIds.size);
      document.getElementById('compare-count').textContent = String(state.compareIds.length);
      updateSummary();

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl p-10 text-center border border-[#dfe5e0] text-sm text-[#5c6660]">${t('noMatches')}</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const activeKey = state.selectedViewByCard[item.id] || item.views[0].key;
        const activeView = item.views.find(v => v.key === activeKey) || item.views[0];
        const isSaved = state.savedIds.has(item.id);
        const title = localizedName(item);
        const anchor = state.lang === 'zh' ? item.bioAnchorZh : item.bioAnchorEn;

        const viewButtons = item.views.map(v => {
          const activeClass = v.key === activeView.key
            ? 'bg-[#235c42] text-white border-[#235c42]'
            : 'bg-[#f4f6f4] text-[#37423b] border-[#dfe5e0] hover:bg-[#e6f0eb]';
          return `<button type="button" data-action="switch-view" data-id="${item.id}" data-view="${v.key}" class="px-2 py-0.5 rounded text-[11px] font-mono-code border transition cursor-pointer ${activeClass}">${v.key}</button>`;
        }).join('');

        return `
          <article class="bg-white rounded-2xl border border-[#dfe5e0] overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
            <div class="relative bg-[#141a17] aspect-[9/14] w-full overflow-hidden group cursor-pointer" data-action="open-modal" data-id="${item.id}">
              <img src="${activeView.src}" alt="${title}" class="w-full h-full object-cover object-top transition duration-300 group-hover:scale-[1.02]" />
              <div class="watermark-overlay absolute inset-0"></div>
              <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-md bg-black/70 text-white font-mono-code text-[11px] backdrop-blur-sm">${item.code}</span>
                <span class="px-2 py-0.5 rounded-md bg-emerald-900/85 text-emerald-100 text-[11px] backdrop-blur-sm">${state.lang === 'zh' ? activeView.labelZh : activeView.labelEn}</span>
              </div>
              <button type="button" data-action="toggle-save" data-id="${item.id}" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center text-sm hover:bg-black/80 cursor-pointer">
                ${isSaved ? '★' : '☆'}
              </button>
              <div class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/65 text-[10px] text-white/90 font-mono-code">
                ${t('assetBadge')}
              </div>
            </div>

            <div class="p-3.5 flex-1 flex flex-col justify-between space-y-3">
              <div class="space-y-1.5">
                <div class="flex flex-wrap items-center gap-1">
                  ${viewButtons}
                </div>
                <h3 class="font-serif-title font-bold text-sm text-[#16201a] pt-1 cursor-pointer hover:text-[#235c42]" data-action="open-modal" data-id="${item.id}">
                  ${title}
                </h3>
                <p class="text-[11px] italic text-[#5c6660] font-mono-code">${item.latin}</p>
                <p class="text-xs text-[#4a554e] line-clamp-2 leading-relaxed">${anchor}</p>
              </div>

              <div class="pt-2 border-t border-[#eef2ee] flex items-center justify-between gap-2 text-xs">
                <button type="button" data-action="open-modal" data-id="${item.id}" class="text-[#235c42] font-medium hover:underline cursor-pointer">
                  ${t('viewDetails')}
                </button>
                <button type="button" data-action="add-compare" data-id="${item.id}" class="px-2.5 py-1 rounded-lg bg-[#f0f4f1] hover:bg-[#e2ebe4] text-[#1e2621] text-[11px] font-medium cursor-pointer">
                  + ${t('addToCompare')}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderGinkgoMatrix() {
      const container = document.getElementById('ginkgo-matrix-grid');
      const ginkgoItems = CATALOG.filter(i => i.taxonKey === 'ginkgo');
      if (ginkgoItems.length === 0) {
        container.innerHTML = `<p class="col-span-full text-sm text-[#5c6660]">${t('noTaxonMatches')}</p>`;
        return;
      }
      container.innerHTML = ginkgoItems.map(item => {
        const view = item.views[0];
        const title = localizedName(item);
        const description = state.lang === 'zh' ? item.translationZh : item.translationEn;
        const categoryKey = CATEGORY_KEYS[item.garmentLine];
        return `
          <div class="bg-[#f9fbf9] rounded-2xl border border-[#dfe5e0] overflow-hidden flex flex-col">
            <div class="relative aspect-[9/14] bg-[#141a17] cursor-pointer" data-action="open-modal" data-id="${item.id}">
              <img src="${view.src}" alt="${title}" class="w-full h-full object-cover object-top" />
              <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded bg-black/75 text-white font-mono-code text-xs">${item.code}</span>
            </div>
            <div class="p-4 space-y-2 flex-1 flex flex-col justify-between">
              <div>
                <div class="text-[11px] font-semibold text-[#235c42]">${t(categoryKey || 'tabGallery')}</div>
                <h4 class="font-serif-title font-bold text-sm text-[#16201a] mt-0.5">${title}</h4>
                <p class="text-xs text-[#4a554e] mt-1.5 leading-relaxed">${description || ''}</p>
              </div>
              <button type="button" data-action="open-modal" data-id="${item.id}" class="w-full py-1.5 rounded-lg bg-white border border-[#cbd5ce] text-xs font-medium hover:bg-[#e6f0eb] cursor-pointer">
                ${t('viewAll')} (${item.views.length})
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCompareView() {
      const container = document.getElementById('compare-grid');
      const pair = state.compareIds.map(id => CATALOG.find(i => i.id === id)).filter(Boolean);
      if (pair.length === 0) {
        container.innerHTML = `<p class="text-sm text-[#5c6660]">${t('noMatches')}</p>`;
        return;
      }
      container.innerHTML = pair.map(item => {
        const activeKey = state.selectedViewByCard[item.id] || item.views[0].key;
        const activeView = item.views.find(v => v.key === activeKey) || item.views[0];
        const title = localizedName(item);
        const anchor = state.lang === 'zh' ? item.bioAnchorZh : item.bioAnchorEn;
        const translation = state.lang === 'zh' ? item.translationZh : item.translationEn;
        const pills = item.views.map(v => `
          <button type="button" data-action="switch-view" data-id="${item.id}" data-view="${v.key}" class="px-2.5 py-1 rounded text-xs font-mono-code border cursor-pointer ${v.key === activeView.key ? 'bg-[#235c42] text-white border-[#235c42]' : 'bg-white text-[#37423b] border-[#cbd5ce]'}">${v.key}</button>
        `).join('');
        return `
          <div class="bg-[#f9fbf9] rounded-2xl border border-[#dfe5e0] p-4 flex flex-col sm:flex-row gap-4">
            <div class="sm:w-1/2 relative bg-[#141a17] rounded-xl overflow-hidden">
              <img src="${activeView.src}" alt="${title}" class="w-full h-auto object-contain" />
            </div>
            <div class="sm:w-1/2 flex flex-col justify-between space-y-3">
              <div class="space-y-2">
                <span class="font-mono-code text-xs px-2 py-0.5 rounded bg-[#e6f0eb] text-[#1e4633] font-semibold">${item.code}</span>
                <h3 class="font-serif-title font-bold text-base text-[#16201a]">${title}</h3>
                <p class="text-xs italic text-[#5c6660] font-mono-code">${item.latin}</p>
                <div class="flex flex-wrap gap-1 pt-1">${pills}</div>
                <div class="p-3 rounded-xl bg-white border border-[#dfe5e0] text-xs space-y-1">
                  <div class="font-semibold text-[#1e4633]">${t('compareAnchor')}</div>
                  <p class="text-[#37423b]">${anchor}</p>
                </div>
                <div class="p-3 rounded-xl bg-white border border-[#dfe5e0] text-xs space-y-1">
                  <div class="font-semibold text-[#1e4633]">${t('compareTranslation')}</div>
                  <p class="text-[#37423b]">${translation}</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDirectoryTable() {
      const tbody = document.getElementById('directory-table-body');
      const categories = Object.keys(CATEGORY_KEYS).map(key => ({
        key,
        items: CATALOG.filter(item => item.garmentLine === key)
      })).filter(group => group.items.length > 0);
      tbody.innerHTML = categories.map(group => {
        const clades = [...new Set(group.items.map(item => item.clade))]
          .map(clade => t(CLADE_KEYS[clade] || 'allClades')).join(', ');
        const examples = group.items.slice(0, 4).map(localizedName).join(', ');
        const viewTotal = group.items.reduce((sum, item) => sum + item.views.length, 0);
        return `
        <tr class="hover:bg-[#f7faf8]">
          <td class="py-3 px-3.5 font-medium text-[#16201a]">${t(CATEGORY_KEYS[group.key])}</td>
          <td class="py-3 px-3.5 text-right font-mono-code font-semibold">${group.items.length}</td>
          <td class="py-3 px-3.5 text-right font-mono-code">${viewTotal}</td>
          <td class="py-3 px-3.5 text-[#37423b]">${clades}</td>
          <td class="py-3 px-3.5 text-[#5c6660]">${examples}</td>
        </tr>
      `;
      }).join('');
    }

    function openDetailModal(itemId) {
      const item = CATALOG.find(i => i.id === itemId);
      if (!item) return;
      state.modalItemId = itemId;
      const activeKey = state.selectedViewByCard[item.id] || item.views[0].key;
      const activeView = item.views.find(v => v.key === activeKey) || item.views[0];

      document.getElementById('modal-img').src = activeView.src;
      document.getElementById('modal-code').textContent = item.code + ' · ' + (state.lang === 'zh' ? item.seriesZh : (item.seriesEn || t(CATEGORY_KEYS[item.garmentLine] || 'tabGallery')));
      document.getElementById('modal-img').alt = localizedName(item);
      document.getElementById('modal-title').textContent = localizedName(item);
      document.getElementById('modal-latin').textContent = item.latin;
      document.getElementById('modal-anchor').textContent = state.lang === 'zh' ? item.bioAnchorZh : item.bioAnchorEn;
      document.getElementById('modal-translation').textContent = state.lang === 'zh' ? item.translationZh : item.translationEn;

      const strip = document.getElementById('modal-view-strip');
      strip.innerHTML = item.views.map(v => `
        <button type="button" data-action="modal-switch-view" data-id="${item.id}" data-view="${v.key}" class="px-3 py-1 rounded-lg text-xs font-mono-code transition cursor-pointer ${v.key === activeView.key ? 'bg-emerald-600 text-white font-semibold' : 'bg-white/15 text-white hover:bg-white/25'}">
          ${v.key} (${state.lang === 'zh' ? v.labelZh : v.labelEn})
        </button>
      `).join('');

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      ['gallery', 'taxon-matrix', 'compare', 'directory'].forEach(t => {
        const sec = document.getElementById('view-' + t);
        const btn = document.getElementById('tab-' + t);
        if (t === tabName) {
          sec.classList.remove('hidden');
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition bg-white text-[#16201a] shadow-sm';
        } else {
          sec.classList.add('hidden');
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition text-[#4a554e] hover:text-[#16201a]';
        }
      });
      if (tabName === 'taxon-matrix') renderGinkgoMatrix();
      if (tabName === 'compare') renderCompareView();
      if (tabName === 'directory') renderDirectoryTable();
    }

    function updateFilterPillsUI() {
      document.querySelectorAll('.filter-pill').forEach(btn => {
        const group = btn.getAttribute('data-filter-group');
        const val = btn.getAttribute('data-filter-val');
        const isActive = state[group] === val;
        if (isActive) {
          btn.classList.add('bg-[#235c42]', 'text-white');
          btn.classList.remove('bg-[#f0f4f1]', 'text-[#37423b]');
        } else {
          btn.classList.remove('bg-[#235c42]', 'text-white');
          btn.classList.add('bg-[#f0f4f1]', 'text-[#37423b]');
        }
      });
    }

    // Event Listeners
    document.getElementById('tab-gallery').addEventListener('click', () => switchTab('gallery'));
    document.getElementById('tab-taxon-matrix').addEventListener('click', () => switchTab('taxon-matrix'));
    document.getElementById('tab-compare').addEventListener('click', () => switchTab('compare'));
    document.getElementById('tab-directory').addEventListener('click', () => switchTab('directory'));
    document.getElementById('btn-back-gallery-from-taxon').addEventListener('click', () => switchTab('gallery'));

    document.getElementById('search-input').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderCards();
    });

    document.getElementById('toggle-extended').addEventListener('change', (e) => {
      state.showExtended = e.target.checked;
      renderCards();
    });

    document.getElementById('toggle-mannequin').addEventListener('change', (e) => {
      state.mannequinOnly = e.target.checked;
      renderCards();
    });

    document.getElementById('btn-filter-saved').addEventListener('click', () => {
      state.savedOnly = !state.savedOnly;
      const btn = document.getElementById('btn-filter-saved');
      btn.className = state.savedOnly
        ? 'px-3 py-1.5 rounded-xl border border-[#235c42] bg-[#235c42] text-white font-medium transition cursor-pointer'
        : 'px-3 py-1.5 rounded-xl border border-[#dfe5e0] bg-white hover:bg-[#f0f4f1] font-medium transition cursor-pointer';
      renderCards();
    });

    document.getElementById('btn-reset-filters').addEventListener('click', () => {
      state.search = '';
      state.garment = 'all';
      state.clade = 'all';
      state.organ = 'all';
      state.showExtended = true;
      state.mannequinOnly = false;
      state.savedOnly = false;
      document.getElementById('search-input').value = '';
      document.getElementById('toggle-extended').checked = true;
      document.getElementById('toggle-mannequin').checked = false;
      document.getElementById('btn-filter-saved').className = 'px-3 py-1.5 rounded-xl border border-[#dfe5e0] bg-white hover:bg-[#f0f4f1] font-medium transition cursor-pointer';
      updateFilterPillsUI();
      renderCards();
    });

    document.getElementById('filter-panel').addEventListener('click', (event) => {
      const btn = event.target.closest('.filter-pill');
      if (btn) {
        const group = btn.getAttribute('data-filter-group');
        const val = btn.getAttribute('data-filter-val');
        state[group] = val;
        updateFilterPillsUI();
        renderCards();
      }
    });

    document.getElementById('btn-lang-toggle').addEventListener('click', () => {
      state.lang = state.lang === 'zh' ? 'en' : 'zh';
      applyLanguage();
    });

    document.getElementById('btn-open-license').addEventListener('click', () => {
      document.getElementById('license-modal').classList.remove('hidden');
    });
    document.getElementById('btn-close-license').addEventListener('click', () => {
      document.getElementById('license-modal').classList.add('hidden');
    });
    document.getElementById('btn-ack-license').addEventListener('click', () => {
      document.getElementById('license-modal').classList.add('hidden');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('detail-modal').classList.add('hidden');
      state.modalItemId = null;
    });

    document.getElementById('modal-btn-copy-json').addEventListener('click', () => {
      const item = CATALOG.find(i => i.id === state.modalItemId);
      if (!item) return;
      const cleanMeta = {
        id: item.id,
        code: item.code,
        taxonKey: item.taxonKey,
        latin: item.latin,
        name: { zh: item.nameZh, en: item.nameEn },
        garmentLine: item.garmentLine,
        clade: item.clade,
        organ: item.organ,
        license: "Non-Commercial & No-AI-Training (TDMRep: Reservation=1)"
      };
      copyText(JSON.stringify(cleanMeta, null, 2), t('toastCopied'));
    });

    document.getElementById('modal-btn-add-compare').addEventListener('click', () => {
      if (!state.modalItemId) return;
      if (!state.compareIds.includes(state.modalItemId)) {
        state.compareIds = [state.compareIds[state.compareIds.length - 1], state.modalItemId];
      }
      document.getElementById('detail-modal').classList.add('hidden');
      switchTab('compare');
      showToast(t('toastAddedCompare'));
    });

    document.getElementById('btn-clear-compare').addEventListener('click', () => {
      state.compareIds = ['HC-L005', 'BC-M001'];
      renderCompareView();
      showToast(t('toastResetCompare'));
    });

    document.getElementById('btn-copy-robots').addEventListener('click', () => {
      const snippet = "User-agent: GPTBot\nDisallow: /\nUser-agent: CCBot\nDisallow: /\nUser-agent: Google-Extended\nDisallow: /\nUser-agent: ClaudeBot\nDisallow: /";
      copyText(snippet, t('toastPolicyCopied'));
    });

    // Global delegated click listener for dynamic cards and modals
    document.body.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');
      const id = target.getAttribute('data-id');
      const view = target.getAttribute('data-view');

      if (action === 'switch-view' && id && view) {
        e.stopPropagation();
        state.selectedViewByCard[id] = view;
        renderCards();
        if (state.activeTab === 'compare') renderCompareView();
      } else if (action === 'modal-switch-view' && id && view) {
        e.stopPropagation();
        state.selectedViewByCard[id] = view;
        openDetailModal(id);
        renderCards();
      } else if (action === 'open-modal' && id) {
        openDetailModal(id);
      } else if (action === 'toggle-save' && id) {
        e.stopPropagation();
        if (state.savedIds.has(id)) {
          state.savedIds.delete(id);
          showToast(t('toastRemovedSaved'));
        } else {
          state.savedIds.add(id);
          showToast(t('toastAddedSaved'));
        }
        renderCards();
      } else if (action === 'add-compare' && id) {
        e.stopPropagation();
        if (!state.compareIds.includes(id)) {
          state.compareIds = [state.compareIds[state.compareIds.length - 1], id];
        }
        renderCards();
        showToast(t('toastAddedCompareHint'));
      }
    });

    // Prevent right-click context menu on images to protect assets
    document.addEventListener('contextmenu', (e) => {
      if (e.target && e.target.tagName === 'IMG') {
        e.preventDefault();
        showToast(t('toastCopyright'));
      }
    });

    // Initial render
    applyLanguage();

    // Load the checked-in catalog and merge entries not present in the embedded fallback.
    fetch('./data/catalog.json')
      .then(response => {
        if (response.ok) return response.json().then(data => ({ data, assetPrefix: '.' }));
        return fetch('./public/data/catalog.json').then(localResponse =>
          localResponse.ok ? localResponse.json().then(data => ({ data, assetPrefix: './public' })) : null
        );
      })
      .then(result => {
        const data = result && result.data;
        if (data && data.counts) {
          if (Number.isFinite(data.counts.totalWebpFiles)) {
            document.getElementById('kpi-webp-count').textContent = String(data.counts.totalWebpFiles);
          }
          if (Number.isFinite(data.counts.totalAssetBytes)) {
            document.getElementById('kpi-size-count').textContent =
              (data.counts.totalAssetBytes / (1024 * 1024)).toFixed(1);
          }
        }
        if (data && Array.isArray(data.items)) {
          const existingIds = new Set(CATALOG.map(i => i.id));
          data.items.forEach(item => {
            if (!existingIds.has(item.id) && Array.isArray(item.views) && item.views.length > 0) {
              const mappedViews = item.views.map(v => ({
                key: v.key,
                labelZh: v.key,
                labelEn: v.key,
                src: result.assetPrefix + v.preview
              }));
              CATALOG.push({
                id: item.id,
                code: item.code,
                taxonKey: item.taxonKey || item.id.toLowerCase(),
                nameZh: item.name.zh + ' · 植物仿生设计',
                nameEn: item.name.en,
                latin: item.name.en,
                garmentLine: item.garmentLine,
                clade: item.clade,
                organ: item.organ,
                seriesZh: item.series,
                seriesEn: UI_TEXT.en[CATEGORY_KEYS[item.garmentLine]] || item.series,
                bioAnchorZh: '植物类群：' + (UI_TEXT.zh[CLADE_KEYS[item.clade]] || item.clade) + ' · 形态结构：' + (UI_TEXT.zh[ORGAN_KEYS[item.organ]] || item.organ),
                bioAnchorEn: 'Clade: ' + (UI_TEXT.en[CLADE_KEYS[item.clade]] || item.clade) + ' · Morphology: ' + (UI_TEXT.en[ORGAN_KEYS[item.organ]] || item.organ),
                translationZh: '云端已转码 WebP 资产（含 TDMRep: Reservation=1 防训练 EXIF 标记）',
                translationEn: 'Cloud-transcoded WebP asset with TDMRep: Reservation=1 anti-AI-training EXIF.',
                extended: Boolean(item.extended),
                hasMannequin: mappedViews.some(v => v.key === 'PRODUCT'),
                views: mappedViews
              });
              state.selectedViewByCard[item.id] = mappedViews[0].key;
            }
          });
          applyLanguage();
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
